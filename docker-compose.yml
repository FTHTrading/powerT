services:
  postgres:
    image: postgres:16-alpine
    container_name: powert-postgres
    environment:
      POSTGRES_DB: powert
      POSTGRES_USER: powert_app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/ledger-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powert_app -d powert"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
